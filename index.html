<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>九数天赋解读｜天赋图鉴</title>
  <meta name="description" content="填写出生日期，转动九数轮，获取你的九数天赋解读与个人天赋说明书。">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="talent-report.css">
  <link rel="stylesheet" href="phase-two.css">
  <link rel="stylesheet" href="mystic-wheel.css">
  <link rel="stylesheet" href="wheel-tuning.css">
  <link rel="stylesheet" href="typography-tuning.css">
  <link rel="stylesheet" href="talent-detail.css">
  <link rel="stylesheet" href="button-effects.css">
  <link rel="stylesheet" href="hook.css">
</head>
<body>
  <header class="nav shell hook-nav">
    <a class="brand" href="#top"><span class="brand-mark">✦</span><span>天赋图鉴</span></a>
    <a class="hook-nav-link" href="#reading">开始解读</a>
  </header>

  <main id="top">
    <section id="reading" class="reading shell hook-reading">
      <div class="hook-intro">
        <p class="eyebrow">九数天赋探索</p>
        <h1>你的出生日期<br>藏着怎样的天赋？</h1>
        <p>输入出生日期，转动九数轮，查看你的天赋模式与个人天赋说明书。</p>
      </div>

      <form id="birth-form" class="hook-form">
        <label for="birth">出生日期</label>
        <div class="form-row"><input id="birth" type="date" required><button class="button primary" type="submit" data-i18n="generate">启动九数轮 →</button></div>
        <select id="focus" hidden><option value="talent" selected>天赋与自我</option></select>
        <small>日期仅在本页计算，不会上传或保存。</small>
      </form>

      <div class="oracle-stage" id="oracle-stage">
        <div class="oracle-stars" aria-hidden="true"></div>
        <div class="oracle-pointer" aria-hidden="true"><i></i></div>
        <div class="wheel-halo" aria-hidden="true"></div>
        <div class="nine-wheel" id="nine-wheel" aria-hidden="true">
          <div class="etched-ring ring-a"></div><div class="etched-ring ring-b"></div><div class="etched-ring ring-c"></div>
          <div class="number-orbit">
            <span style="--i:0"><b>壹</b><em>1</em></span><span style="--i:1"><b>贰</b><em>2</em></span><span style="--i:2"><b>叁</b><em>3</em></span><span style="--i:3"><b>肆</b><em>4</em></span><span style="--i:4"><b>伍</b><em>5</em></span><span style="--i:5"><b>陆</b><em>6</em></span><span style="--i:6"><b>柒</b><em>7</em></span><span style="--i:7"><b>捌</b><em>8</em></span><span style="--i:8"><b>玖</b><em>9</em></span>
          </div>
          <div class="trigram-ring"><span>☰</span><span>☱</span><span>☲</span><span>☳</span><span>☴</span><span>☵</span><span>☶</span><span>☷</span></div>
        </div>
        <button class="oracle-core" id="wheel-trigger" type="submit" form="birth-form"><small id="wheel-system-label">九数玄轮</small><strong id="wheel-action">点击转动</strong><span id="wheel-status">等待生日坐标</span></button>
        <div class="orbit-spark spark-one"></div><div class="orbit-spark spark-two"></div><div class="orbit-spark spark-three"></div>
      </div>

      <div id="result" class="talent-report" hidden>
        <div class="report-top">
          <div><small id="report-kicker">九数主系统</small><h3 id="result-title"></h3><p id="result-copy"></p><div class="report-chips"><span id="result-element"></span><span id="result-secondary"></span><span id="result-number"></span></div></div>
          <div class="radar-wrap"><svg id="talent-radar" viewBox="0 0 320 300" role="img" aria-label="天赋雷达图"><g id="radar-grid"></g><polygon id="radar-shape" points="160,50 270,130 228,255 92,255 50,130"></polygon><g id="radar-labels"></g></svg></div>
        </div>
        <div class="score-bars" id="score-bars"></div>
        <div class="report-cards">
          <article><small id="strength-label">核心优势</small><h4 id="result-strength"></h4><p id="strength-copy"></p></article>
          <article><small id="balance-label">平衡提醒</small><h4 id="balance-title"></h4><p id="balance-copy"></p></article>
          <article><small id="strategy-label">东方战略提示</small><h4 id="strategy-title"></h4><p id="strategy-copy"></p></article>
        </div>
        <div id="talent-detail" class="talent-detail"></div>
        <p class="algorithm-note" id="algorithm-note"></p>
      </div>

      <div class="engine-support" hidden aria-hidden="true">
        <div data-i18n="demoTitle"></div>
        <div data-i18n="demoText"></div>
        <div id="match-label"></div><div id="match-title"></div><div id="match-copy"></div><div id="match-link"></div>
        <div id="original-lens-label"></div><div id="original-lens-title"></div><div id="original-lens-copy"></div>
        <div id="chinese-lens-label"></div><div id="chinese-lens-title"></div><div id="chinese-lens-copy"></div>
        <div id="maya-lens-label"></div><div id="maya-lens-title"></div><div id="maya-lens-copy"></div>
        <div id="path-label"></div><div id="path-title"></div><div id="path-copy"></div>
        <div id="step-calc-label"></div><div id="step-calc-title"></div><div id="step-calc-copy"></div>
        <div id="step-see-label"></div><div id="step-see-title"></div><div id="step-see-copy"></div>
        <div id="step-ask-label"></div><div id="step-ask-title"></div><div id="step-ask-copy"></div>
        <div id="step-observe-label"></div><div id="step-observe-title"></div><div id="step-observe-copy"></div>
      </div>
    </section>
  </main>

  <footer class="shell hook-footer"><span>天赋图鉴 · 九数天赋探索</span><small>结果用于文化探索和自我反思，不构成专业建议或命运预测。</small></footer>
  <script>let lang='zh'</script>
  <script src="talent-detail.js"></script>
  <script src="talent-engine.js"></script>
  <script src="hook-runtime.js"></script>
</body>
</html>
